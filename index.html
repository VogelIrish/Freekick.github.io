  const lineMat=new THREE.MeshBasicMaterial({color:0xf5f0dc});
  [[[-20,-18],[-20,10]],[[20,-18],[20,10]],[[-20,-18],[20,-18]],[[-12,-18],[-12,-5]],[[12,-18],[12,-5]],[[-12,-5],[12,-5]]]
    .forEach(([a,b])=>rod([a[0],.015,a[1]],[b[0],.015,b[1]],.043,lineMat));
  const arc=new THREE.Mesh(
    new THREE.TorusGeometry(3.5,.04,6,48,Math.PI),
    lineMat
  );
  arc.rotation.x=-Math.PI/2;arc.position.set(0,.02,-5);scene.add(arc);

  const concrete=[material(0x354e5b),material(0x496371)];
  const shirtColors=[material(0xd77b53),material(0xe5d4b1),material(0x67969b),material(0x263b54)];
  const crowd=[];
  for(let row=0;row<8;row++){
    const z=-28-row*2.15,y=.4+row*.85;
    box(88,.7,2.3,concrete[row%2],0,y,z);
    for(let i=0;i<36;i++){
      const x=-40+i*2.25;
      box(.43,.48,.33,shirtColors[(i+row)%4],x,y+.59,z+.2);
      const head=sphere(.15,material((i+row)%3===0?0xc3916b:0x896247),x,y+1,z+.2,scene,8);
      head.userData.base=y+1;crowd.push(head);
    }
  }
  for(const side of [-1,1]){
    for(let row=0;row<6;row++)box(2,.8,75,concrete[row%2],side*(31+row*1.55),.4+row*.8,-2);
    rod([side*27,0,-33],[side*27,15,-33],.16,dark);
    for(let i=0;i<5;i++)sphere(.24,material(0xffe3a0,{emissive:0xffca73,emissiveIntensity:1}),side*27-2+i,15,-32.5);
  }
  for(let i=0;i<12;i++)box(5,.9,.14,shirtColors[i%4],-27.5+i*5,.55,-24.2);

  const goalZ=-18,goalH=3.55,half=4,ballR=.31;
  const frameMat=material(0xfdfbf0,{roughness:.22,metalness:.18});
  for(const x of [-half,half]){
    rod([x,0,goalZ],[x,goalH,goalZ],.15,frameMat);
    rod([x,goalH,goalZ],[x,goalH,goalZ-2.4],.075,frameMat);
    rod([x,0,goalZ-2.4],[x,goalH,goalZ-2.4],.055,frameMat);
  }
  rod([-half,goalH,goalZ],[half,goalH,goalZ],.16,frameMat);
  const netMat=new THREE.LineBasicMaterial({color:0xe9f2ed,transparent:true,opacity:.7});
  function netLine(points){
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p))),netMat
    ));
  }
  for(let x=-4;x<=4.01;x+=.4)netLine([[x,0,goalZ],[x,goalH,goalZ],[x,goalH,goalZ-2.4],[x,0,goalZ-2.4]]);
  for(let y=0;y<=goalH+.01;y+=.4)netLine([[-4,y,goalZ],[4,y,goalZ],[4,y,goalZ-2.4],[-4,y,goalZ-2.4]]);

  const jerseyPalette=[0xf07854,0x328eaf,0xeac05a,0x93b76a,0xece8db];
  const jerseys=[];
  function player(x,keeperPlayer=false){
    const root=new THREE.Group();root.position.set(x,0,0);
    const jersey=material(keeperPlayer?0xf07854:0xece8db);
    if(!keeperPlayer)jerseys.push(jersey);
    const shorts=material(0x263a55);
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.27,.34,.78,12),jersey);
    torso.position.y=1.48;torso.castShadow=true;root.add(torso);
    box(.58,.24,.37,shorts,0,.99,0,root);
    sphere(.22,skin,0,2.12,0,root);
    const hair=sphere(.22,dark,0,2.25,-.025,root,12);hair.scale.y=.42;
    for(const side of [-1,1]){
      rod([side*.18,.98,0],[side*.23,.17,.07],.09,skin,root);
      box(.24,.14,.42,dark,side*.23,.08,.15,root);
      rod([side*.3,1.75,0],[side*(keeperPlayer?.61:.44),1.36,.02],.1,jersey,root);
      sphere(.09,keeperPlayer?white:skin,side*(keeperPlayer?.62:.45),1.34,.02,root,10);
    }
    return root;
  }
  const wall=new THREE.Group();wall.position.z=-11.9;scene.add(wall);
  for(let i=0;i<4;i++)wall.add(player((i-1.5)*.79));
  const keeper=player(0,true);keeper.position.z=-17.1;keeper.scale.setScalar(1.08);scene.add(keeper);

  const ball=new THREE.Group();scene.add(ball);
  sphere(ballR,material(0xfffdf5,{roughness:.23,metalness:.05}),0,0,0,ball,40);
  const patchMat=material(0x243a4e,{side:THREE.DoubleSide});
  for(let i=0;i<22;i++){
    const y=1-2*(i+.5)/22,r=Math.sqrt(1-y*y);
    const normal=new THREE.Vector3(r*Math.cos(i*2.39996),y,r*Math.sin(i*2.39996));
    const patch=new THREE.Mesh(new THREE.CircleGeometry(.075,5),patchMat);
    patch.position.copy(normal).multiplyScalar(.313);
    patch.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),normal);
    ball.add(patch);
  }
  const shadow=new THREE.Mesh(
    new THREE.CircleGeometry(.45,28),
    new THREE.MeshBasicMaterial({color:0x102d34,transparent:true,opacity:.32,depthWrite:false})
  );
  shadow.rotation.x=-Math.PI/2;scene.add(shadow);
  const guide=new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({color:0x83c8ff,transparent:true,opacity:.9,depthTest:false})
  );
  guide.renderOrder=4;scene.add(guide);
  const trail=Array.from({length:8},(_,i)=>{
    const particle=sphere(.12-i*.011,new THREE.MeshBasicMaterial({
      color:0xffd69a,transparent:true,opacity:.4,depthWrite:false
    }),0,0,0,scene,8);
    particle.visible=false;return particle;
  });

  const start=spot=>new THREE.Vector3(spot,ballR,9),gravity=9.8;
  function launch(power,x,y,spot,cx,cy){
    const origin=start(spot),travel=1.12-(power-25)*.0042;
    const acceleration=new THREE.Vector3(cx*5.8,cy*2.8,0);
    const velocity=new THREE.Vector3(x,y,goalZ).sub(origin).divideScalar(travel);
    velocity.x-=.5*acceleration.x*travel;
    velocity.y+=.5*(gravity-acceleration.y)*travel;
    return {origin,velocity,acceleration,travel};
  }
  function trajectory(f,t){
    return f.origin.clone().addScaledVector(f.velocity,t)
      .addScaledVector(f.acceleration,.5*t*t)
      .add(new THREE.Vector3(0,-.5*gravity*t*t,0));
  }
  function updateGuide(){
    if(state.phase==='flight'||replaying)return;
    const shot=launch(state.power,state.aimX,state.aimY,0,state.curveX,state.curveY);
    const points=Array.from({length:27},(_,i)=>trajectory(shot,shot.travel*.77*i/26));
    guide.geometry.dispose();
    guide.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),36,.052,5,false);
    guide.visible=true;
  }
  function view(){
    if(state.phase==='flight'||replaying)return;
    camera.position.set(0,2.45,15.3);camera.lookAt(0,1.6,-17);
    ball.position.copy(start(0));ball.rotation.set(0,0,0);
    shadow.position.set(0,.01,9);updateGuide();
  }
  function resize(){
    const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
    renderer.setSize(rect.width,rect.height,false);
    camera.aspect=rect.width/rect.height;
    camera.fov=rect.width<700?70:58;
    camera.updateProjectionMatrix();
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize',resize);
  resize();view();

  function setPhase(phase){
    state.phase=phase;
    ['ready','power','precision'].forEach(name=>
      document.querySelector(`[data-template-id="shoot-${name}"]`).classList.toggle('hidden',phase!==name)
    );
    $('shoot').disabled=phase==='flight'||replaying;
    $('phase-hint').textContent=phase==='power'
      ?'Pulsa otra vez para fijar la potencia.'
      :phase==='precision'?'Pulsa cuando el indicador esté en verde.':'';
    guide.visible=phase!=='flight'&&!replaying;
  }
  function setPower(value){
    state.power=Math.round(clamp(value,25,100));
    $('power-value').textContent=state.power+'%';
    $('power-fill').style.width=state.power+'%';
    $('power-meter').setAttribute('aria-valuenow',state.power);
  }
  function adjustAim(dx,dy){
    if(state.phase==='flight'||replaying)return;
    state.aimX=clamp(state.aimX+dx,-5.5,5.5);
    state.aimY=clamp(state.aimY+dy,.4,5);
    updateGuide();
  }
  function adjustCurve(dx,dy){
    if(state.phase==='flight'||replaying)return;
    state.curveX=clamp(Math.round((state.curveX+dx)*10)/10,-4,4);
    state.curveY=clamp(Math.round((state.curveY+dy)*10)/10,-4,4);
    $('curve-value').textContent=`↔ ${state.curveX>0?'+':''}${state.curveX.toFixed(1)} · ↕ ${state.curveY>0?'+':''}${state.curveY.toFixed(1)}`;
    updateGuide();
  }
  [['aim-left',-.3,0],['aim-right',.3,0],['aim-up',0,.18],['aim-down',0,-.18]]
    .forEach(([id,x,y])=>$(id).addEventListener('click',()=>adjustAim(x,y)));
  let dragging=false,previous=null;
  canvas.addEventListener('pointerdown',event=>{
    canvas.focus();dragging=true;previous={x:event.clientX,y:event.clientY};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event=>{
    if(!dragging||!previous||state.phase==='flight'||replaying)return;
    const rect=canvas.getBoundingClientRect();
    adjustAim((event.clientX-previous.x)/rect.width*12,-(event.clientY-previous.y)/rect.height*8);
    previous={x:event.clientX,y:event.clientY};
  });
  ['pointerup','pointercancel','lostpointercapture']
    .forEach(type=>canvas.addEventListener(type,()=>{dragging=false;previous=null;}));
  document.addEventListener('keydown',event=>{
    if(event.target instanceof HTMLInputElement)return;
    const key=event.key.toLowerCase();
    if(['w','a','s','d'].includes(key)){
      event.preventDefault();
      adjustCurve(key==='a'?.2:key==='d'?-.2:0,key==='w'?-.2:key==='s'?.2:0);
      return;
    }
    if(![canvas,$('shoot'),document.body].includes(document.activeElement))return;
    if(event.code==='Space'&&!event.repeat){event.preventDefault();action();return;}
    if(key.startsWith('arrow')){
      event.preventDefault();
      adjustAim(key==='arrowleft'?-.28:key==='arrowright'?.28:0,
        key==='arrowup'?.18:key==='arrowdown'?-.18:0);
    }
  });

  function action(){
    if(state.phase==='flight'||replaying)return;
    if(state.phase==='ready'){
      state.phaseStart=performance.now();setPhase('power');
    }else if(state.phase==='power'){
      state.phaseStart=performance.now();setPhase('precision');
    }else{
      const cycle=((performance.now()-state.phaseStart)%1200)/1200;
      const position=cycle<.5?cycle*2:2-cycle*2;
      const precision=clamp(1-Math.abs(position-.5)*2,0,1);
      kick(precision);setPhase('flight');
    }
  }
  $('shoot').addEventListener('click',action);

  function kick(precision){
    const spot=(Math.random()*2-1)*3;
    jerseys.forEach((shirt,i)=>shirt.color.setHex(jerseyPalette[(state.shots+1+i*2)%jerseyPalette.length]));
    camera.position.set(spot,2.45,15.3);camera.lookAt(spot*.1,1.6,-17);
    sound('kick');guide.visible=false;$('call').classList.add('hidden');
    const error=1-precision,angle=Math.random()*Math.PI*2;
    const spread=error*error*(.35+Math.random()*3.3);
    const x=state.aimX+Math.cos(angle)*spread;
    const y=state.aimY+Math.sin(angle)*spread*.65;
    flight={...launch(state.power,x,y,spot,state.curveX,state.curveY),
      time:0,previous:start(spot),resolved:false,after:0,bounce:null,frames:[],
      precision,spectacular:false};
    wall.position.x=clamp(state.aimX*.3,-1.1,1.1);
  }
  function showCall(label,goal){
    const element=$('call');
    element.textContent=label;element.style.color=goal?'#ffb45f':'#ff9c78';
    element.classList.remove('hidden');
  }
  function beginReplay(frames){
    if(!frames?.length)return;
    replaying=true;replayStart=performance.now();replayFrames=frames;
    $('shoot').disabled=true;$('skip-replay').classList.remove('hidden');
    guide.visible=false;showCall('↻ REPETICIÓN DEL GOLAZO',true);
  }
  function endReplay(){
    replaying=false;
    $('skip-replay').classList.add('hidden');
    $('call').classList.add('hidden');
    trail.forEach(item=>item.visible=false);
    setPhase('ready');view();
  }
  $('replay').addEventListener('click',()=>{
    if(replayFrames&&!replaying&&state.phase==='ready')beginReplay(replayFrames);
  });
  $('skip-replay').addEventListener('click',()=>{if(replaying)endReplay();});

  function resolve(kind,label){
    if(!flight||flight.resolved)return;
    const f=flight;f.resolved=true;f.after=0;state.shots++;
    const goal=kind==='goal';
    if(goal){
      state.goals++;state.streak++;
      state.points+=100+(state.streak-1)*50;
      f.spectacular=f.precision>.72||Math.abs(state.curveX)>.7||Math.abs(state.curveY)>.7;
    }else state.streak=0;
    $('score').textContent=state.goals;
    $('shots').textContent=state.shots;
    $('points').textContent=String(state.points).padStart(3,'0');
    const dot=document.createElement('span');
    dot.className='dot '+(goal?'goal':'fail');
    dot.textContent=goal?'✓':'×';
    dot.setAttribute('aria-label',`Tiro ${state.shots}: ${label}`);
    $('progress').appendChild(dot);
    while($('progress').children.length>5)$('progress').firstElementChild.remove();
    showCall(label,goal);sound(kind);
  }
  function bounceFrom(p,v,kind,label){
    flight.bounce={position:p.clone(),velocity:v,time:0,net:kind==='goal'};
    resolve(kind,label);
  }
  function resetShot(){
    const finished=flight;flight=null;
    trail.forEach(item=>item.visible=false);
    keeper.position.set(0,0,-17.1);keeper.rotation.z=0;wall.position.x=0;
    state.curveX=0;state.curveY=0;adjustCurve(0,0);
    setPower(25);setPhase('ready');view();
    if(finished?.spectacular){
      replayFrames=finished.frames.map(p=>p.clone());
      $('replay').classList.remove('hidden');
      beginReplay(replayFrames);
    }else $('call').classList.add('hidden');
  }
  function flightFrame(dt){
    if(!flight)return;
    const f=flight;let p;
    if(f.bounce){
      const b=f.bounce;b.time+=dt;
      p=b.position.clone().addScaledVector(b.velocity,b.time);
      p.y=Math.max(ballR,b.position.y+b.velocity.y*b.time-(b.net?2.6:4.9)*b.time*b.time);
      if(b.net)p.z=Math.max(goalZ-1.05,p.z);
    }else{
      f.time+=dt;p=trajectory(f,f.time);
      const previous=f.previous,crossed=z=>previous.z>z&&p.z<=z;
      if(!f.resolved&&crossed(-11.9)&&Math.abs(p.x-wall.position.x)<1.6&&p.y<2.4){
        bounceFrom(p,new THREE.Vector3((p.x-wall.position.x)*2.5,2.3,8),'wall','¡BARRERA!');
      }else if(!f.resolved&&crossed(-17.1)){
        if(Math.abs(p.x)<2.75&&p.y>ballR&&p.y<3.65&&(state.power<94||f.precision<.96)){
          keeper.position.x=clamp(p.x*1.3,-3,3);keeper.position.y=.35;
          keeper.rotation.z=p.x>=0?-.8:.8;
          bounceFrom(p,new THREE.Vector3(p.x>=0?-4:4,2.3,7),'save','¡PARADÓN!');
        }else keeper.position.x=clamp(p.x*.5,-2.2,2.2);
      }
      if(!f.resolved&&crossed(goalZ+.2)){
        const post=Math.abs(Math.abs(p.x)-half)<.47&&p.y<goalH+.3;
        const bar=Math.abs(p.y-goalH)<.47&&Math.abs(p.x)<half+.3;
        if(post||bar)bounceFrom(p,new THREE.Vector3(p.x<0?5:-5,2,9),'post',post?'¡PALO!':'¡TRAVESAÑO!');
        else if(Math.abs(p.x)<half-ballR&&p.y>ballR&&p.y<goalH-ballR)
          bounceFrom(p,new THREE.Vector3(0,.55,-.7),'goal','¡GOLAZO!');
        else resolve('miss','¡FUERA!');
      }
      if(!f.resolved&&p.y<=ballR&&f.time>.12){
        p.y=ballR;bounceFrom(p,new THREE.Vector3(0,1.4,6),'miss','¡FUERA!');
      }
      if(!f.resolved&&f.time>3)resolve('miss','¡FUERA!');
      f.previous.copy(p);
    }
    ball.position.copy(p);ball.rotation.x-=dt*10;
    if(f.frames.length<250)f.frames.push(p.clone());
    trail.forEach((item,i)=>{
      const index=f.frames.length-1-i*2;
      item.visible=index>=0;
      if(item.visible)item.position.copy(f.frames[index]);
    });
    shadow.position.set(p.x,.01,p.z);
    shadow.material.opacity=clamp(.35-p.y*.05,.06,.35);
    if(f.resolved){f.after+=dt;if(f.after>1.15)resetShot();}
  }

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(now){
    const dt=Math.min((now-last)/1000||0,.04);last=now;
    if(state.phase==='power')
      setPower(25+75*(.5-.5*Math.cos((now-state.phaseStart)/300*Math.PI*2)));
    if(state.phase==='precision'){
      const cycle=((now-state.phaseStart)%1200)/1200;
      $('precision-cursor').style.left=`calc(${(cycle<.5?cycle*2:2-cycle*2)*100}% - 2px)`;
    }
    if(!reduced)crowd.forEach((person,i)=>{
      person.position.y=person.userData.base+Math.abs(Math.sin(now*.003+i*.73))*.05;
    });
    if(replaying&&replayFrames){
      const index=Math.floor((now-replayStart)/(reduced?12:45));
      if(index>=replayFrames.length)endReplay();
      else{
        const p=replayFrames[index];ball.position.copy(p);ball.rotation.x-=dt*5;
        camera.position.lerp(new THREE.Vector3(p.x+3.8,Math.max(2.1,p.y+2.1),p.z+7.5),.075);
        camera.lookAt(p.x*.55,p.y*.8,p.z-4.5);
        shadow.position.set(p.x,.01,p.z);
        trail.forEach((item,i)=>{
          const trailIndex=index-i*2;
          item.visible=trailIndex>=0;
          if(item.visible)item.position.copy(replayFrames[trailIndex]);
        });
      }
    }else flightFrame(dt);
    renderer.render(scene,camera);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
 </body>
</html>
