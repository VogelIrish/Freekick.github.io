    @media(max-width:700px){.stage{height:690px}.controls{left:10px;right:10px;bottom:10px}.controls>.panel{width:100%}.sound-controls{top:43px;right:10px;bottom:auto}}

  <script>
  (() => {
    const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const state={name:'',shots:0,goals:0,points:0,streak:0,aimX:1.5,aimY:2.2,curveX:0,curveY:0,power:25,precision:0,phase:'ready',phaseStart:0};
    let backendRecords=[],loaded=false,loadTimer,attempt=0,flight=null,replayFrames=null,replaying=false,replayStart=0,last=0,audio,musicOn=false,musicTimer,beat=0;
    const nameValue=()=>$('player-name').value.trim().replace(/\s+/g,' ');
    const status=message=>$('name-status').textContent=message;

    function renderActivity(){
      if(!loaded)return;
      const rows=[...backendRecords].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,8);
      $('activity-status').textContent=rows.length?'':'Todavía no hay usos. ¡Sé el primero en entrar a la cancha!';
      $('activity-status').classList.toggle('hidden',!!rows.length);
      const list=$('activity-list'),existing=new Map([...list.children].map(el=>[el.dataset.recordId,el]));
      rows.forEach(row=>{
        const id=String(row.__backendId);
        let el=existing.get(id);
        if(!el){
          el=document.createElement('div');el.className='recent-row';el.dataset.recordId=id;
          const left=document.createElement('div'),name=document.createElement('strong'),when=document.createElement('p'),result=document.createElement('span');
          name.className='block truncate';when.className='text-xs text-[#385274] mt-0.5';result.className='mono text-xs font-bold whitespace-nowrap text-right';
          left.className='min-w-0';left.append(name,when);el.append(left,result);
        }
        const date=new Date(row.created_at),when=Number.isNaN(date.getTime())?'Fecha no disponible':new Intl.DateTimeFormat('es-MX',{dateStyle:'short',timeStyle:'short'}).format(date);
        const values=[String(row.player_name||'Jugador'),when,Number(row.goals)>0?`⚽ ${Number(row.goals)} gol · ${Number(row.points)||0} pts`:'Entró a jugar'];
        [el.children[0].children[0],el.children[0].children[1],el.children[1]].forEach((node,i)=>{if(node.textContent!==values[i])node.textContent=values[i];});
        list.appendChild(el);existing.delete(id);
      });
      existing.forEach(el=>el.remove());
      $('activity-limit').classList.toggle('hidden',backendRecords.length<950);
      $('activity-limit').textContent=backendRecords.length>=950?`Quedan ${999-backendRecords.length} registros disponibles.`:'';
    }
    async function initData(){
      const current=++attempt;loaded=false;
      clearTimeout(loadTimer);
      $('activity-status').classList.remove('hidden');
      $('activity-status').textContent='Cargando últimos usos…';
      $('retry-activity').classList.add('hidden');
      const showError=()=>{if(current!==attempt||loaded)return;$('activity-status').textContent='No se pudieron cargar los últimos usos.';$('retry-activity').classList.remove('hidden');};
      loadTimer=setTimeout(showError,8000);
      try{
        const result=await window.dataSdk.init({onDataChanged(data){
          if(current!==attempt)return;
          clearTimeout(loadTimer);loaded=true;backendRecords=data;
          $('retry-activity').classList.add('hidden');renderActivity();
        }});
        if(!result.isOk){clearTimeout(loadTimer);showError();}
      }catch(_){clearTimeout(loadTimer);showError();}
    }
    $('retry-activity').addEventListener('click',initData);
    initData();

    async function createEntry(record,control,success){
      if(backendRecords.length>=999){status('Se alcanzó el límite de 999 registros.');return false;}
      control.disabled=true;
      try{
        const result=await window.dataSdk.create(record);
        if(!result.isOk){status('No se pudo confirmar el envío. Actualiza antes de intentarlo de nuevo.');return false;}
        status(success);return true;
      }catch(_){status('No se pudo confirmar el envío. Actualiza antes de intentarlo de nuevo.');return false;}
      finally{control.disabled=false;}
    }
    $('player-form').addEventListener('submit',async event=>{

            bounceFrom(p,new THREE.Vector3(0,.55,-.7),'goal','¡GOLAZO!');
          else resolve('miss','¡FUERA!');
        }
        if(!f.resolved&&p.y<=ballR&&f.time>.12){p.y=ballR;bounceFrom(p,new THREE.Vector3(0,1.4,6),'miss','¡FUERA!');}
        if(!f.resolved&&f.time>3)resolve('miss','¡FUERA!');
        f.previous.copy(p);
      }
      ball.position.copy(p);ball.rotation.x-=dt*10;
      if(f.frames.length<250)f.frames.push(p.clone());
      f.history.unshift(p.clone());if(f.history.length>trail.length)f.history.pop();
      trail.forEach((item,i)=>{item.visible=!!f.history[i];if(f.history[i])item.position.copy(f.history[i]);});
      shadow.position.set(p.x,.01,p.z);shadow.material.opacity=clamp(.35-p.y*.05,.06,.35);
      if(f.resolved){f.after+=dt;if(f.after>1.15)resetShot();}
    }
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function draw(now){
      const dt=Math.min((now-last)/1000||0,.04);last=now;
      if(state.phase==='power')setPower(25+75*(.5-.5*Math.cos((now-state.phaseStart)/300*Math.PI*2)));
      if(state.phase==='precision'){
        const cycle=((now-state.phaseStart)%1200)/1200;
        $('precision-cursor').style.left=`calc(${(cycle<.5?cycle*2:2-cycle*2)*100}% - 2px)`;
      }
      const crowdTime=now*.0035;crowdPeople.forEach((person,i)=>{const celebrating=now<person.userData.celebrateUntil?person.userData.celebrate:0;const bounce=Math.abs(Math.sin(crowdTime*2.2+i*.73))*.055;const cheer=celebrating*Math.abs(Math.sin(crowdTime*5.5+i*1.17))*.22;person.position.y=person.userData.baseY+bounce+cheer;person.rotation.z=Math.sin(crowdTime*1.8+i*.61)*.16+Math.sin(crowdTime*5+i)*celebrating*.42;person.rotation.x=Math.cos(crowdTime*2.1+i*.47)*.12+Math.sin(crowdTime*4.3+i*.8)*celebrating*.3;});
      if(replaying&&replayFrames){
        const index=Math.floor((now-replayStart)/(reduced?12:45));
        if(index>=replayFrames.length){
          replaying=false;ball.position.copy(start(0));trail.forEach(item=>item.visible=false);
          $('skip-replay').classList.add('hidden');$('call').classList.add('hidden');target.visible=true;setPhase('ready');view();
        }else{
          const p=replayFrames[index];ball.position.copy(p);ball.rotation.x-=dt*5;
          const replayCamera=new THREE.Vector3(p.x+3.8,Math.max(2.1,p.y+2.1),p.z+7.5);
          camera.position.lerp(replayCamera,.075);
          camera.lookAt(p.x*.55,p.y*.8,p.z-4.5);shadow.position.set(p.x,.01,p.z);
          trail.forEach((item,i)=>{const trailIndex=index-i*2;item.visible=trailIndex>=0&&trailIndex<replayFrames.length;if(item.visible)item.position.copy(replayFrames[trailIndex]);});
        }
      }else flightFrame(dt);
      renderer.render(scene,camera);requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
  </script>
